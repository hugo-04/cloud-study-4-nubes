# CSI Secrets Store en AKS: monta secretos de Key Vault como archivos (y, opcional, como Secret de Kubernetes).
# Requisitos: add-on activado
#   az aks enable-addons -g <rg> -n <aks> --addons azure-keyvault-secrets-provider --enable-secret-rotation
# y Workload Identity configurado (ver 02-iam/workload-identity).
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: kv-api
  namespace: modalima
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    clientID: "__CLIENT_ID__"              # clientId de la managed identity federada
    keyvaultName: kv-modalima-estudio01
    tenantId: "__TENANT_ID__"
    objects: |
      array:
        - |
          objectName: db-password
          objectType: secret
          objectAlias: spring.datasource.password   # nombre del archivo montado
  # Opcional: crear además un Secret de Kubernetes (para variables de entorno)
  secretObjects:
    - secretName: api-secretos
      type: Opaque
      data:
        - objectName: spring.datasource.password
          key: DB_PASSWORD
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: modalima
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: sa-api
      containers:
        - name: api
          image: ghcr.io/example/api:1.0.0
          env:
            - name: SPRING_CONFIG_IMPORT
              value: "optional:configtree:/mnt/secrets-store/"
          volumeMounts:
            - name: secretos
              mountPath: /mnt/secrets-store
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
      volumes:
        - name: secretos
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: kv-api
# Notas:
#  - Los ARCHIVOS se actualizan cuando cambia el secreto (con la rotación activada).
#  - Las variables de entorno creadas desde secretObjects NO se actualizan hasta reiniciar el pod.
#  - El Secret de Kubernetes solo existe mientras haya un pod que monte el volumen.
