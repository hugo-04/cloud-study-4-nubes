# Al fusionar a main: primero dev; si sale bien, producción (que pide aprobación en su entorno).
name: terraform-apply

on:
  push:
    branches: [main]
    paths: ["infra/**"]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  dev:
    uses: ./.github/workflows/_entorno.yml
    with:
      entorno: dev

  prod:
    needs: dev
    uses: ./.github/workflows/_entorno.yml
    with:
      entorno: prod
