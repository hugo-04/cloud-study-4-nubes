# Ingress con el add-on "application routing" de AKS.
# Requisitos: az aks approuting enable ...  →  IngressClass "webapprouting.kubernetes.azure.com"
# kubectl apply -f 10-ingress-approuting.yaml
apiVersion: v1
kind: Namespace
metadata:
  name: modalima
---
apiVersion: v1
kind: Service
metadata:
  name: svc-pedidos
  namespace: modalima
spec:
  type: ClusterIP            # NUNCA LoadBalancer: la única puerta es el ingress
  selector:
    app: pedidos
  ports:
    - name: http
      port: 80
      targetPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: svc-catalogo
  namespace: modalima
spec:
  type: ClusterIP
  selector:
    app: catalogo
  ports:
    - name: http
      port: 80
      targetPort: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: api-modalima
  namespace: modalima
  annotations:
    # Límites ajustados SOLO donde hacen falta (aquí, para todo el Ingress; separa en otro Ingress si solo una ruta los necesita).
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: webapprouting.kubernetes.azure.com
  tls:
    - hosts:
        - api.modalima.example
      secretName: tls-api-modalima        # lo crea cert-manager, o el add-on desde Key Vault
  rules:
    - host: api.modalima.example
      http:
        paths:
          - path: /pedidos
            pathType: Prefix
            backend:
              service:
                name: svc-pedidos
                port:
                  number: 80
          - path: /catalogo
            pathType: Prefix
            backend:
              service:
                name: svc-catalogo
                port:
                  number: 80
---
# Entrada INTERNA (solo red privada): el Service del controlador con IP privada.
# Con el add-on se configura mediante un NginxIngressController adicional (CRD del add-on).
apiVersion: approuting.kubernetes.azure.com/v1alpha1
kind: NginxIngressController
metadata:
  name: interno
spec:
  ingressClassName: interno.webapprouting.kubernetes.azure.com
  controllerNamePrefix: nginx-interno
  loadBalancerAnnotations:
    service.beta.kubernetes.io/azure-load-balancer-internal: "true"
