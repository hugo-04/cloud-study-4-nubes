# application-azure.properties (Spring Boot): lo mínimo recomendado para correr en App Service.
# Actívalo con SPRING_PROFILES_ACTIVE=azure

# Puerto que define la plataforma y apagado ordenado
server.port=${SERVER_PORT:8080}
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

# Detrás del proxy de App Service: confiar en X-Forwarded-*
server.forward-headers-strategy=framework

# Salud para la plataforma (health check = /actuator/health/readiness)
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db
management.endpoint.health.show-details=never

# Logs a la salida estándar (App Service la captura)
logging.pattern.console=%d{ISO8601} %-5level [%X{clientIp}] %logger{36} - %msg%n

# Base de datos: la contraseña llega como app setting (referencia a Key Vault)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.max-lifetime=240000
spring.datasource.hikari.connection-timeout=5000
