# application-k8s.properties (Spring Boot): perfil para Kubernetes. Actívalo con SPRING_PROFILES_ACTIVE=k8s

server.port=8080
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

# Sondas (K8s): /actuator/health/liveness y /actuator/health/readiness
management.endpoint.health.probes.enabled=true
management.endpoint.health.probes.add-additional-paths=true
management.endpoint.health.group.readiness.include=readinessState,db
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.show-details=never
management.endpoints.web.exposure.include=health,prometheus
management.metrics.tags.application=api-pedidos

# Hilos virtuales para E/S bloqueante
spring.threads.virtual.enabled=true

# Base de datos: pool pequeño y vida máxima menor que el tiempo de inactividad de la red (~4 min)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.max-lifetime=240000
spring.datasource.hikari.connection-timeout=5000

# Secretos montados por CSI como archivos
spring.config.import=optional:configtree:/mnt/secrets-store/

# Logs a la salida estándar (los recoge Container Insights)
logging.pattern.console=%d{ISO8601} %-5level [${POD_NAME:local}] %logger{36} - %msg%n
