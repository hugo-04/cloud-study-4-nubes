# application.properties (Quarkus) para Kubernetes
quarkus.http.port=8080
quarkus.http.host=0.0.0.0
quarkus.shutdown.timeout=30s

# Sondas: /q/health/live, /q/health/ready, /q/health/started
quarkus.smallrye-health.root-path=/q/health

# Métricas para Prometheus: /q/metrics
quarkus.micrometer.export.prometheus.enabled=true

# Cliente REST hacia otro servicio del clúster (FQDN + timeouts)
quarkus.rest-client.pedidos.url=http://svc-pedidos.modalima.svc.cluster.local
quarkus.rest-client.pedidos.connect-timeout=2000
quarkus.rest-client.pedidos.read-timeout=3000

# Base de datos
quarkus.datasource.jdbc.max-size=10
quarkus.datasource.jdbc.max-lifetime=PT4M

# Generar manifiestos e imagen desde Maven (quarkus-kubernetes + quarkus-container-image-jib)
quarkus.container-image.registry=acrmodalima.azurecr.io
quarkus.container-image.group=modalima
quarkus.kubernetes.namespace=modalima
quarkus.kubernetes.replicas=3
quarkus.kubernetes.resources.requests.memory=768Mi
quarkus.kubernetes.resources.limits.memory=768Mi
quarkus.kubernetes.liveness-probe.http-action-path=/q/health/live
quarkus.kubernetes.readiness-probe.http-action-path=/q/health/ready
