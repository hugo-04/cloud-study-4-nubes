apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: hpa-api-pedidos
  namespace: modalima
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: api-pedidos
  minReplicas: 3
  maxReplicas: 12
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70          # contra los REQUESTS de CPU
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300     # no reducir de golpe
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 60
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: pdb-api-pedidos
  namespace: modalima
spec:
  maxUnavailable: 1                       # permite drenar un nodo a la vez sin bloquear upgrades
  selector:
    matchLabels:
      app: api-pedidos
