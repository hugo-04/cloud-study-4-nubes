# Emulador local de Event Hubs (SDK nativo y, según versión, endpoint Kafka). Necesita Azurite para metadatos.
# Uso:
#   export ACCEPT_EULA=Y CONFIG_PATH=$PWD/Config.json
#   docker compose up -d
# Cadena de conexión (sin Entra ID):
#   Endpoint=sb://localhost;SharedAccessKeyName=RootManageSharedAccessKey;SharedAccessKey=SAS_KEY_VALUE;UseDevelopmentEmulator=true;
# Verifica en la documentación del emulador los puertos, las funciones no soportadas y si expone Kafka en tu versión.
name: eventhubs-emulador
services:
  emulator:
    container_name: eventhubs-emulator
    image: mcr.microsoft.com/azure-messaging/eventhubs-emulator:latest
    pull_policy: always
    volumes:
      - "${CONFIG_PATH}:/Eventhubs_Emulator/ConfigFiles/Config.json"
    ports:
      - "5672:5672"   # AMQP
      - "9092:9092"   # Kafka (si tu versión del emulador lo expone)
      - "5300:5300"   # salud / administración
    environment:
      BLOB_SERVER: azurite
      METADATA_SERVER: azurite
      ACCEPT_EULA: "${ACCEPT_EULA}"
    depends_on:
      - azurite
    networks:
      eh-emulator:
        aliases:
          - eh-emulator

  azurite:
    container_name: azurite
    image: mcr.microsoft.com/azure-storage/azurite:latest
    command: "azurite --blobHost 0.0.0.0 --queueHost 0.0.0.0 --tableHost 0.0.0.0"
    ports:
      - "10000:10000"
      - "10001:10001"
      - "10002:10002"
    networks:
      eh-emulator:
        aliases:
          - azurite

networks:
  eh-emulator:
