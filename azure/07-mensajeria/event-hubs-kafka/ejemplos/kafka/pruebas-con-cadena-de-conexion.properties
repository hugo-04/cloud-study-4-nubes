# SOLO PRUEBAS: SASL PLAIN con la cadena de conexión (requiere local_authentication_enabled = true).
# En producción usa OAUTHBEARER. Nunca subas esta cadena a Git: léela de una variable de entorno.
bootstrap.servers=evhns-modalima.servicebus.windows.net:9093
security.protocol=SASL_SSL
sasl.mechanism=PLAIN
sasl.jaas.config=org.apache.kafka.common.security.plain.PlainLoginModule required username="$ConnectionString" password="${EVENTHUBS_CONNECTION_STRING}";
