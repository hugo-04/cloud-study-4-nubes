# Productor Kafka hacia Event Hubs con Entra ID (OAUTHBEARER).
# Requiere en el classpath la clase pe.modalima.kafka.EntraIdCallbackHandler (ver uso-en-java.md, sección 5).
bootstrap.servers=evhns-modalima.servicebus.windows.net:9093
security.protocol=SASL_SSL
sasl.mechanism=OAUTHBEARER
sasl.jaas.config=org.apache.kafka.common.security.oauthbearer.OAuthBearerLoginModule required;
sasl.login.callback.handler.class=pe.modalima.kafka.EntraIdCallbackHandler

key.serializer=org.apache.kafka.common.serialization.StringSerializer
value.serializer=org.apache.kafka.common.serialization.StringSerializer

acks=all
enable.idempotence=true
linger.ms=20
batch.size=65536
compression.type=none
retries=2147483647
delivery.timeout.ms=120000
request.timeout.ms=60000
max.request.size=1000000

# El balanceador de Azure cierra conexiones inactivas (~4 min)
metadata.max.age.ms=180000
connections.max.idle.ms=180000
