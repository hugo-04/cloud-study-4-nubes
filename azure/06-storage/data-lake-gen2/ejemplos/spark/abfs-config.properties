# Configuración de Hadoop/Spark para leer y escribir en Data Lake Gen2 con identidad (sin claves de la cuenta).
# Se usa en spark-defaults.conf (prefijo "spark.hadoop.") o en la configuración del clúster/pool.
# Reemplaza <cuenta>, <tenant-id>, <client-id>. Verifica en la doc de tu motor la versión de Hadoop (hadoop-azure) disponible.

# ---- Opción A: identidad administrada (VM, AKS con identidad de nodo, Synapse, Databricks con identidad)
spark.hadoop.fs.azure.account.auth.type.<cuenta>.dfs.core.windows.net=OAuth
spark.hadoop.fs.azure.account.oauth.provider.type.<cuenta>.dfs.core.windows.net=org.apache.hadoop.fs.azurebfs.oauth2.MsiTokenProvider
spark.hadoop.fs.azure.account.oauth2.msi.tenant.<cuenta>.dfs.core.windows.net=<tenant-id>
spark.hadoop.fs.azure.account.oauth2.client.id.<cuenta>.dfs.core.windows.net=<client-id-de-la-identidad-administrada>

# ---- Opción B: principal de servicio (secreto desde Key Vault / secret scope; NUNCA en texto plano)
# spark.hadoop.fs.azure.account.auth.type.<cuenta>.dfs.core.windows.net=OAuth
# spark.hadoop.fs.azure.account.oauth.provider.type.<cuenta>.dfs.core.windows.net=org.apache.hadoop.fs.azurebfs.oauth2.ClientCredsTokenProvider
# spark.hadoop.fs.azure.account.oauth2.client.id.<cuenta>.dfs.core.windows.net=<client-id>
# spark.hadoop.fs.azure.account.oauth2.client.secret.<cuenta>.dfs.core.windows.net={{secrets/lago/cliente-secreto}}
# spark.hadoop.fs.azure.account.oauth2.client.endpoint.<cuenta>.dfs.core.windows.net=https://login.microsoftonline.com/<tenant-id>/oauth2/token

# ---- Opción C: identidad de carga de trabajo (AKS con Workload Identity) en versiones recientes de hadoop-azure
# spark.hadoop.fs.azure.account.oauth.provider.type.<cuenta>.dfs.core.windows.net=org.apache.hadoop.fs.azurebfs.oauth2.WorkloadIdentityTokenProvider

# ---- Rendimiento (ajusta según medición)
spark.hadoop.fs.azure.write.request.size=8388608
spark.hadoop.fs.azure.read.request.size=4194304
spark.hadoop.fs.azure.readahead.range=4194304

# Rutas de ejemplo en tu código:
#   abfss://bronze@<cuenta>.dfs.core.windows.net/ventas/
#   abfss://silver@<cuenta>.dfs.core.windows.net/ventas/anio=2026/mes=10/
