# Cliente de línea de comandos / aplicaciones con autenticación IAM (puerto 9098).
# Requiere aws-msk-iam-auth en el classpath (en Kafka CLI: copiar el JAR a libs/).
security.protocol=SASL_SSL
sasl.mechanism=AWS_MSK_IAM
sasl.jaas.config=software.amazon.msk.auth.iam.IAMLoginModule required;
sasl.client.callback.handler.class=software.amazon.msk.auth.iam.IAMClientCallbackHandler

# Asumir un rol explícito (opcional; por defecto usa la cadena de credenciales del entorno):
# sasl.jaas.config=software.amazon.msk.auth.iam.IAMLoginModule required awsRoleArn="arn:aws:iam::111122223333:role/prod-facturacion";
