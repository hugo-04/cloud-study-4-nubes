# Alternativa con usuario y contraseña (puerto 9096). El secreto vive en Secrets Manager (nombre AmazonMSK_*).
security.protocol=SASL_SSL
sasl.mechanism=SCRAM-SHA-512
sasl.jaas.config=org.apache.kafka.common.security.scram.ScramLoginModule required username="facturacion" password="${SCRAM_PASSWORD}";
