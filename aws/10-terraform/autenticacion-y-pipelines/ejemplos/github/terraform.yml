# .github/workflows/terraform.yml
# PR  → plan con el rol de LECTURA (sin aprobación).
# main → plan guardado → (aprobación del entorno prod) → apply del MISMO plan con el rol de CAMBIO.
name: terraform

on:
  pull_request:
    paths: ["infra/**"]
  push:
    branches: [main]
    paths: ["infra/**"]

permissions:
  contents: read

# Nunca canceles un apply en curso: deja el candado y un estado parcial.
concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  AWS_REGION: us-east-1
  DIRECTORIO: infra/envs/prod

jobs:
  plan:
    runs-on: ubuntu-latest
    permissions:
      id-token: write        # necesario para pedir el token OIDC
      contents: read
    defaults:
      run:
        working-directory: ${{ env.DIRECTORIO }}
    steps:
      - uses: actions/checkout@v4          # en producción, fija las acciones por hash de commit
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5
          terraform_wrapper: false

      - name: Credenciales temporales (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::111122223333:role/terraform-plan-prod
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gha-${{ github.run_id }}

      - run: terraform init -backend-config=backend.prod.hcl
      - run: terraform fmt -check -recursive
      - run: terraform validate
      - name: Plan guardado
        run: |
          terraform plan -out=tfplan -lock-timeout=5m
          terraform show -json tfplan > plan.json

      - name: Puerta de seguridad (no destruir datos, no abrir puertos al mundo)
        run: |
          jq -e '[.resource_changes[]
                  | select(.change.actions | index("delete"))
                  | select(.type | IN("aws_db_instance","aws_rds_cluster","aws_dynamodb_table","aws_s3_bucket","aws_kms_key","aws_efs_file_system"))
                 ] | length == 0' plan.json \
            || { echo "::error::El plan destruye recursos con datos. Requiere excepción documentada."; exit 1; }
          jq -e '[.resource_changes[]
                  | select(.type == "aws_security_group_rule" or .type == "aws_vpc_security_group_ingress_rule")
                  | select(.change.after | tostring | test("0\\.0\\.0\\.0/0"))
                  | select(.change.after.from_port != 443 and .change.after.from_port != 80)
                 ] | length == 0' plan.json \
            || { echo "::error::El plan abre puertos al mundo."; exit 1; }

      # El archivo del plan puede contener valores sensibles: retención corta y repositorio privado.
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push'
        with:
          name: tfplan
          path: ${{ env.DIRECTORIO }}/tfplan
          retention-days: 1

  aplicar:
    needs: plan
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: prod            # aprobadores y ramas permitidas; viaja en el "sub" del token
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: ${{ env.DIRECTORIO }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5
          terraform_wrapper: false
      - uses: actions/download-artifact@v4
        with:
          name: tfplan
          path: ${{ env.DIRECTORIO }}

      - name: Credenciales temporales (OIDC) con el rol de cambio
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::111122223333:role/terraform-apply-prod
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gha-apply-${{ github.run_id }}

      - run: terraform init -backend-config=backend.prod.hcl
      # Se aplica el MISMO archivo que se planificó y se aprobó; no se vuelve a planificar.
      - run: terraform apply -input=false tfplan
