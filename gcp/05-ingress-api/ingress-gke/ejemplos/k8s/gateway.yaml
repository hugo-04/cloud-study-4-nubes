apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: tienda
  namespace: plataforma
spec:
  gatewayClassName: gke-l7-global-external-managed
  addresses:
    - type: NamedAddress
      value: ip-gateway-tienda
  listeners:
    - name: https
      protocol: HTTPS
      port: 443
      hostname: tienda.modalima.example
      tls:
        mode: Terminate
        options:
          networking.gke.io/cert-manager-certs: cert-tienda
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels: { gateway-tienda: permitido }
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: pedidos
  namespace: tienda
spec:
  parentRefs:
    - { name: tienda, namespace: plataforma }
  hostnames: [tienda.modalima.example]
  rules:
    - matches:
        - path: { type: PathPrefix, value: /api/pedidos }
      backendRefs:
        - { name: pedidos, port: 8080, weight: 90 }
        - { name: pedidos-canario, port: 8080, weight: 10 }
---
apiVersion: networking.gke.io/v1
kind: HealthCheckPolicy
metadata:
  name: pedidos
  namespace: tienda
spec:
  default:
    config:
      type: HTTP
      httpHealthCheck: { port: 8080, requestPath: /actuator/health/readiness }
  targetRef: { group: "", kind: Service, name: pedidos }
---
apiVersion: networking.gke.io/v1
kind: GCPBackendPolicy
metadata:
  name: pedidos
  namespace: tienda
spec:
  default:
    securityPolicy: tienda
    timeoutSec: 30
  targetRef: { group: "", kind: Service, name: pedidos }
