apiVersion: apps/v1
kind: Deployment
metadata:
  name: pedidos
  namespace: tienda
spec:
  replicas: 3
  selector:
    matchLabels: { app: pedidos }
  template:
    metadata:
      labels: { app: pedidos }
    spec:
      serviceAccountName: pedidos
      terminationGracePeriodSeconds: 30
      containers:
        - name: app
          image: southamerica-west1-docker.pkg.dev/modalima-tienda-prod/apps/pedidos:1.4.2
          ports: [{ containerPort: 8080 }]
          resources:
            requests: { cpu: 500m, memory: 768Mi }
            limits: { memory: 768Mi }
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: 8080 }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: 8080 }
            initialDelaySeconds: 30
          lifecycle:
            preStop:
              exec: { command: ["sh", "-c", "sleep 10"] }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: pedidos
  namespace: tienda
spec:
  minAvailable: 2
  selector:
    matchLabels: { app: pedidos }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: pedidos
  namespace: tienda
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: pedidos }
  minReplicas: 3
  maxReplicas: 20
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 65 } }
