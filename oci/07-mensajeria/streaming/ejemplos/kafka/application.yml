# Spring Kafka contra OCI Streaming (protocolo Kafka). El token sale de Vault, nunca del repositorio.
spring:
  kafka:
    bootstrap-servers: cell-1.streaming.sa-saopaulo-1.oci.oraclecloud.com:9092
    security:
      protocol: SASL_SSL
    properties:
      sasl.mechanism: PLAIN
      sasl.jaas.config: >-
        org.apache.kafka.common.security.plain.PlainLoginModule required
        username="${OCI_TENANCY_NAME}/${OCI_USUARIO}/${OCI_STREAM_POOL_OCID}"
        password="${OCI_AUTH_TOKEN}";
      max.request.size: 1048576
    producer:
      acks: all
      retries: 5
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      group-id: analitica
      auto-offset-reset: earliest
      enable-auto-commit: false
