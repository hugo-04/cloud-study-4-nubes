apiVersion: v1
kind: Namespace
metadata:
  name: tienda
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: app-tienda
  namespace: tienda
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-tienda
  namespace: tienda
spec:
  replicas: 2
  selector:
    matchLabels:
      app: app-tienda
  template:
    metadata:
      labels:
        app: app-tienda
    spec:
      serviceAccountName: app-tienda
      containers:
        - name: app
          image: ocir.sa-saopaulo-1.oci.oraclecloud.com/NAMESPACE/app-tienda:1.0.0
          env:
            - name: OCI_AUTH
              value: oke
            - name: OCI_REGION
              value: sa-saopaulo-1
